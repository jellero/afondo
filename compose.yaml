services:
  afondo:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AFONDO_DB_PATH: /app/data/afondo.sqlite3
      AFONDO_SOURCE_GRANTS: /app/data/source_grants.json
      AFONDO_INGEST_TOKEN: ${AFONDO_INGEST_TOKEN:-}
      AFONDO_ADMIN_TOKEN: ${AFONDO_ADMIN_TOKEN:-}
      AFONDO_ENCRYPTION_KEY: ${AFONDO_ENCRYPTION_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  preanalysis:
    profiles: ["automation"]
    build: .
    command: ["python", "-m", "afondo.preanalysis_worker"]
    environment:
      AFONDO_DB_PATH: /app/data/afondo.sqlite3
      AFONDO_SOURCE_GRANTS: /app/data/source_grants.json
      AFONDO_ENCRYPTION_KEY: ${AFONDO_ENCRYPTION_KEY:-}
      AFONDO_ENABLE_PREANALYSIS: ${AFONDO_ENABLE_PREANALYSIS:-0}
      AFONDO_PREANALYSIS_INTERVAL_SECONDS: ${AFONDO_PREANALYSIS_INTERVAL_SECONDS:-900}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  source-sync:
    profiles: ["source-automation"]
    build: .
    command: ["python", "-m", "afondo.source_worker"]
    environment:
      AFONDO_DB_PATH: /app/data/afondo.sqlite3
      AFONDO_SOURCE_GRANTS: /app/data/source_grants.json
      AFONDO_ENABLE_SOURCE_SYNC: ${AFONDO_ENABLE_SOURCE_SYNC:-0}
      AFONDO_SOURCE_SYNC_INTERVAL_SECONDS: ${AFONDO_SOURCE_SYNC_INTERVAL_SECONDS:-3600}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
